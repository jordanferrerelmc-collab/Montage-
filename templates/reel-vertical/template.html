<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <meta name="brand" content="{{BRAND}}" />
    <script src="assets/gsap.min.js"></script>
    <style>
      /* charte de marque injectée (brand/<marque>/brand.css) */
{{BRAND_CSS}}

      /* ---- mise en page du format vertical (indépendante de la marque) ---- */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); }

      /* caméra : on zoome ce conteneur, ancré sur le visage */
      #cam { position: absolute; inset: 0; transform-origin: 50% 36%; }
      #punch { position: absolute; inset: 0; transform-origin: 50% 36%; }
      #cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* voile sombre derrière les sous-titres */
      /* bande floutée + assombrie : masque les traces des anciens sous-titres incrustés */
      #shade { position: absolute; left: 0; top: calc(var(--cap-top, 1260px) - 130px); width: 1080px; height: 560px;
        backdrop-filter: blur(18px) brightness(0.62); -webkit-backdrop-filter: blur(18px) brightness(0.62);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000000 22%, #000000 78%, transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000000 22%, #000000 78%, transparent 100%); }

      .cap { position: absolute; left: var(--cap-left, 60px); top: var(--cap-top, 1260px); width: var(--cap-width, 960px); height: 300px;
        display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 0 30px;
        font-weight: 900; font-size: 92px; line-height: 1.08; text-align: center; color: var(--ink);
        letter-spacing: -0.01em; transform-origin: 50% 50%; }

      /* illustrations : zone haute */
      .ill { position: absolute; left: 0; top: var(--ill-top, 150px); width: 1080px; height: 470px;
        display: flex; align-items: center; justify-content: center; }
      .ico { width: 120px; height: 120px; flex: none; }
      .spark { width: 420px; height: 110px; }
      .xmark { position: absolute; width: 330px; height: 330px; }
      .arrow { width: 160px; height: 230px; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.5)); margin-top: 200px; }
      .zzz { position: absolute; right: 90px; top: 10px; font-weight: 900; font-size: 110px; color: var(--ink);
        -webkit-text-stroke: 10px #000000; paint-order: stroke fill; }
      .steprow { display: flex; align-items: center; gap: 30px; }
      .ba { display: flex; gap: 18px; }
      .half { width: 330px; height: 300px; border-radius: 36px; padding: 28px; display: flex; flex-direction: column;
        justify-content: space-between; font-weight: 900; font-size: 50px; }
      .half svg { width: 100%; height: 150px; }
      .before { background: var(--panel-muted); color: var(--stone); }
      .after { background: var(--panel); color: var(--gold); border: 5px solid var(--gold); }
      .wave { display: flex; align-items: center; height: 170px; gap: 0; }
      .bar { display: block; width: 50px; margin: 0 6px; background: var(--gold); border-radius: 12px; transform-origin: 50% 50%; }
      .bar.gap { background: var(--dark); }
      .scissors { position: absolute; width: 150px; height: 150px; left: 465px; top: 160px; }
      .icons { display: flex; gap: 26px; }
      .eng { background: var(--panel); border-radius: 40px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center;
        gap: 8px; color: var(--gold); font-weight: 800; font-size: 62px; border: 4px solid var(--gold); }
      .chart { display: flex; align-items: flex-end; gap: 14px; height: 150px; }
      .cbar { display: block; width: 44px; background: var(--gold); border-radius: 10px; }
      .cta .ico { width: 100px; height: 100px; }


    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="cam"><div id="punch">
        <video id="clip-main" class="clip" src="assets/cut.mp4" data-start="0" data-duration="{{DUR}}" data-has-audio="true" data-volume="1" data-track-index="0"></video>
      </div></div>
      <div id="shade"></div>
      {{ILLUSTRATIONS}}
      <div id="redflash"></div>
      <div id="flash"></div>
      {{CAPTIONS}}
    </div>
    {{SFX}}
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
{{JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
