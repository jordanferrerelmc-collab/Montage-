<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --yellow: #ffe14d;
        --red: #ff6b81;
        --green: #3ddc84;
        --pink: #ff4fd8;
        --ink: #ffffff;
        --panel: rgba(12, 12, 16, 0.86);
        --font: "Montserrat", "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); }

      /* caméra : on zoome ce conteneur, ancré sur le visage */
      #cam { position: absolute; inset: 0; transform-origin: 50% 36%; }
      #punch { position: absolute; inset: 0; transform-origin: 50% 36%; }
      #cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }

      /* voile sombre derrière les sous-titres */
      /* bande floutée + assombrie : masque les traces des anciens sous-titres incrustés */
      #shade { position: absolute; left: 0; top: 1130px; width: 1080px; height: 560px;
        backdrop-filter: blur(18px) brightness(0.62); -webkit-backdrop-filter: blur(18px) brightness(0.62);
        -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
        mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%); }

      .cap { position: absolute; left: 60px; top: 1260px; width: 960px; height: 300px;
        display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 0 30px;
        font-weight: 900; font-size: 92px; line-height: 1.08; text-align: center; color: var(--ink);
        letter-spacing: -0.01em; transform-origin: 50% 50%; }
      .w { display: inline-block; -webkit-text-stroke: 14px #000; paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0,0,0,0.55); transform-origin: 50% 70%; }
      .hl-yellow { color: var(--yellow); }
      .hl-red { color: var(--red); }
      .hl-green { color: var(--green); }
      .hl-pink { color: var(--pink); }

      /* illustrations : zone haute */
      .ill { position: absolute; left: 0; top: 150px; width: 1080px; height: 470px;
        display: flex; align-items: center; justify-content: center; }
      .panel { background: var(--panel); border-radius: 44px; padding: 34px 50px; display: flex; flex-direction: column;
        align-items: center; gap: 12px; color: #fff; box-shadow: 0 24px 60px rgba(0,0,0,0.35); border: 4px solid rgba(255,255,255,0.12); }
      .panel.row { flex-direction: row; gap: 34px; }
      .panel.green { background: rgba(20, 120, 70, 0.92); }
      .ico { width: 120px; height: 120px; flex: none; }
      .big { font-weight: 900; font-size: 92px; line-height: 1; text-align: left; }
      .big small { font-size: 52px; font-weight: 800; opacity: 0.85; }
      .kicker { font-weight: 800; font-size: 42px; letter-spacing: 0.08em; color: var(--yellow); }
      .spark { width: 420px; height: 110px; }
      .chip { font-weight: 900; font-size: 120px; padding: 10px 50px; background: #fff; color: #111; border-radius: 30px; }
      .xmark { position: absolute; width: 330px; height: 330px; }
      .arrow { width: 160px; height: 230px; filter: drop-shadow(0 8px 0 rgba(0,0,0,0.5)); margin-top: 200px; }
      .num { color: var(--yellow); display: inline-block; }
      .bubble { background: #fff; color: #222; font-weight: 700; font-size: 56px; padding: 36px 48px; border-radius: 48px 48px 48px 8px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3); max-width: 860px; }
      .zzz { position: absolute; right: 90px; top: 10px; font-weight: 900; font-size: 110px; color: #fff;
        -webkit-text-stroke: 10px #000; paint-order: stroke fill; }
      .stamp { font-weight: 900; font-size: 230px; color: var(--red); border: 22px solid var(--red); border-radius: 36px;
        padding: 0 50px; transform: rotate(-10deg); background: rgba(255,255,255,0.9); line-height: 1.15; }
      .steprow { display: flex; align-items: center; gap: 30px; }
      .num-badge { width: 170px; height: 170px; border-radius: 50%; background: var(--yellow); color: #111; font-weight: 900;
        font-size: 120px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 0 rgba(0,0,0,0.35); flex: none; }
      .ba { display: flex; gap: 18px; }
      .half { width: 330px; height: 300px; border-radius: 36px; padding: 28px; display: flex; flex-direction: column;
        justify-content: space-between; font-weight: 900; font-size: 50px; }
      .half svg { width: 100%; height: 150px; }
      .before { background: rgba(60,60,60,0.9); color: #ccc; }
      .after { background: rgba(12,12,16,0.9); color: var(--green); border: 5px solid var(--green); }
      .panel.col { padding: 30px 40px; }
      .wave { display: flex; align-items: center; height: 170px; gap: 0; }
      .bar { display: block; width: 50px; margin: 0 6px; background: var(--pink); border-radius: 12px; transform-origin: 50% 50%; }
      .bar.gap { background: #555; }
      .scissors { position: absolute; width: 150px; height: 150px; left: 465px; top: 160px; }
      .icons { display: flex; gap: 26px; }
      .eng { background: var(--panel); border-radius: 40px; padding: 28px 36px; display: flex; flex-direction: column; align-items: center;
        gap: 8px; color: var(--green); font-weight: 900; font-size: 62px; }
      .chart { display: flex; align-items: flex-end; gap: 14px; height: 150px; }
      .cbar { display: block; width: 44px; background: #fff; border-radius: 10px; }
      .cta { display: flex; align-items: center; gap: 26px; background: var(--yellow); color: #111; font-weight: 900; font-size: 74px;
        padding: 36px 56px; border-radius: 999px; box-shadow: 0 18px 0 rgba(0,0,0,0.35); }
      .cta .ico { width: 100px; height: 100px; }

      #flash, #redflash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      #flash { background: #fff; }
      #redflash { background: var(--red); mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="cam"><div id="punch">
        <video id="clip-main" class="clip" src="assets/cut.mp4" data-start="0" data-duration="{{DUR}}" data-has-audio="true" data-volume="1" data-track-index="0"></video>
      </div></div>
      <div id="shade"></div>
      {{ILLUSTRATIONS}}
      <div id="redflash"></div>
      <div id="flash"></div>
      {{CAPTIONS}}
    </div>
    {{SFX}}
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
{{JS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
