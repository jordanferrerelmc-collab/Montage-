    <meta name="montage-style" content="gaming-premium" />

    <style>
      /* charte de marque injectée (brand/<marque>/brand.css) */
      /* ==========================================================================
         Charte Specimen Gaming (TikTok) — SOURCE UNIQUE des couleurs, police et styles.
         Ne pas redéfinir ces couleurs dans les compositions : utiliser les variables.
         ========================================================================== */
      
      /* --- Police VERROUILLÉE : TeX Gyre Heros (équivalent libre d'Helvetica Neue, licence GUST — fonts/GUST-FONT-LICENSE.txt) ---
         Fichiers d'origine non modifiés. Famille propre à la marque : jamais de police de remplacement. */
      @font-face {
        font-family: "Specimen Heros";
        src: url("assets/brand/fonts/texgyreheros-regular.otf") format("opentype");
        font-weight: 100 599;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Specimen Heros";
        src: url("assets/brand/fonts/texgyreheros-bold.otf") format("opentype");
        font-weight: 600 900;
        font-style: normal;
        font-display: block;
      }
      
      :root {
        --red: #da3d39;
        --red-light: #ff5a4e;
        --red-dark: #a82a27;
        --charcoal: #2c2d32;
        --charcoal-deep: #1c1d21;
        --silver: #c9cbd1;
        --ink: #ffffff;
        --flash: #ffffff;
        --panel: rgba(28, 29, 33, 0.92);
        --panel-muted: rgba(44, 45, 50, 0.92);
        --font: "Specimen Heros", sans-serif;
      
        /* alias génériques utilisés par les modèles (accent = couleur de marque) */
        --accent: var(--red);
        --accent-soft: var(--red-light);
        --gold: var(--red);            /* compatibilité avec les modèles existants */
        --gold-light: var(--red-light);
        --black: var(--charcoal-deep);
        --ivory: var(--ink);
        --taupe: var(--silver);
        --stone: var(--silver);
        --dark: var(--charcoal);
        --gold-grad: linear-gradient(135deg, #ff5a4e 0%, #da3d39 55%, #a82a27 100%);
      
        /* mise en page TikTok : éviter les onglets du haut, la colonne d'icônes à droite et la légende du bas */
        --cap-top: 1120px;
        /* texte CENTRÉ, marges égales de 110 px (évite les bords et la colonne d'icônes TikTok) */
        --cap-left: 110px;
        --cap-width: 860px;
        --ill-top: 230px;
      }
      
      /* --- Sous-titres ---------------------------------------------------------- */
      .cap { font-weight: 800; letter-spacing: 0.01em; }
      .w { display: inline-block; -webkit-text-stroke: 14px #000000; paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.55); transform-origin: 50% 70%; }
      .hl, .hl-yellow, .hl-pink, .hl-green, .hl-red { color: var(--red-light); }   /* mot clé */
      .hl-soft { color: var(--silver); }                                          /* mot clé secondaire */
      
      /* --- Cartes et éléments graphiques --------------------------------------- */
      .panel { background: var(--panel); border-radius: 18px; padding: 34px 50px; display: flex; flex-direction: column;
        align-items: center; gap: 12px; color: var(--ink); box-shadow: 8px 8px 0 var(--red); border: 4px solid var(--red); }
      .panel.row { flex-direction: row; gap: 34px; }
      .panel.col { padding: 30px 40px; }
      .panel.green, .panel.accent { background: var(--red); border-color: var(--ink); box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.55); }
      .big { font-weight: 800; font-size: 88px; line-height: 1; text-align: left; letter-spacing: 0.02em; color: var(--ink); }
      .big small { font-size: 52px; font-weight: 700; opacity: 0.85; }
      .kicker { font-weight: 700; font-size: 40px; letter-spacing: 0.14em; color: var(--red-light); }
      .chip { font-weight: 800; font-size: 120px; padding: 10px 50px; background: var(--ink); color: var(--charcoal-deep); border-radius: 14px; letter-spacing: 0.04em; }
      .num { color: var(--red-light); display: inline-block; }
      .bubble { background: var(--ink); color: var(--charcoal-deep); border: 4px solid var(--red); font-weight: 600; font-size: 56px;
        padding: 36px 48px; border-radius: 28px 28px 28px 6px; box-shadow: 8px 8px 0 var(--red); max-width: 820px; }
      .stamp { font-weight: 800; font-size: 200px; color: var(--ink); background: var(--red); border: 14px solid var(--ink); border-radius: 16px;
        letter-spacing: 0.04em; padding: 0 50px; transform: rotate(-8deg); line-height: 1.15; box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.6); }
      .num-badge { width: 170px; height: 170px; border-radius: 22px; background: var(--red); color: var(--ink); border: 6px solid var(--ink);
        font-weight: 800; font-size: 120px; display: flex; align-items: center; justify-content: center; transform: rotate(-6deg);
        box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.5); flex: none; }
      .cta { display: flex; align-items: center; gap: 26px; background: var(--red); color: var(--ink); font-weight: 800; font-size: 66px;
        letter-spacing: 0.04em; padding: 36px 56px; border-radius: 0;
        clip-path: polygon(28px 0, 100% 0, calc(100% - 28px) 100%, 0 100%); box-shadow: none; }
      
      /* --- Transitions ---------------------------------------------------------- */
      #flash, #redflash, #accentflash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      #flash { background: var(--flash); }
      #redflash, #accentflash { background: var(--red); mix-blend-mode: screen; }
      
      /* --- Écran de fin ----------------------------------------------------------- */
      #endcard { position: absolute; inset: 0; background: var(--charcoal); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 60px; }
      #logo { width: 1000px; height: auto;
        -webkit-mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000000 70%, transparent 100%);
        mask-image: radial-gradient(ellipse 72% 70% at 50% 50%, #000000 70%, transparent 100%); }
      #tagline { width: 1080px; text-align: center; font-weight: 700; font-size: 52px; letter-spacing: 0.12em; color: var(--ink); }
      #cam { position: absolute; inset: 0; overflow: hidden; transform-origin: 50% 60%; }   /* zoom ancré au menton : le visage ne descend pas vers les émojis */
      #cam video { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #vign { position: absolute; inset: 0; pointer-events: none;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0.25) 15%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.5) 75%, rgba(0, 0, 0, 0.35) 100%); }
      .handle { top: 200px; left: var(--cap-left); width: var(--cap-width); text-align: center; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
      .bar { position: absolute; left: var(--cap-left); width: var(--cap-width); top: 250px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; }
      /* sous-titres centrés, sur la poitrine, zone sûre TikTok */
      #root .cap { display: block; top: 1440px; height: 130px; line-height: 130px; text-align: center; white-space: nowrap; font-size: 86px;
        -webkit-text-stroke: 12px rgba(0, 0, 0, 0.9); paint-order: stroke fill; text-shadow: 0 6px 26px rgba(0, 0, 0, 0.8); }
      #root .cap .k { margin: 0; }
      .emo { position: absolute; width: 240px; /* zone libre entre le menton et les sous-titres : jamais sur le visage */ text-align: center; line-height: 1; z-index: 5; }
      .emo span { display: inline-block; filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.6)); }
      .ering { position: absolute; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px; border-radius: 50%;
        border: 6px solid var(--accent); opacity: 0; }
      .xbtn { position: absolute; left: 410px; width: 260px; top: 1220px; height: 160px; text-align: center; z-index: 5; }
      .xbtn #xbi { display: inline-block; width: 140px; height: 140px; filter: drop-shadow(0 0 30px rgba(218, 61, 57, 0.7)); }
      .xbtn #xbi svg { width: 100%; height: 100%; }
      .xlab { display: none; font-weight: 700; font-size: 44px; letter-spacing: 0.2em; color: var(--ink); text-shadow: 0 4px 16px rgba(0, 0, 0, 0.8); }


      /* ---- style « gaming premium » (réf. references/gaming-style) ---- */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--charcoal-deep); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); color: var(--ink); }

      /* fond : dégradé radial sombre + halo d'accent qui respire */
      #bg { position: absolute; inset: 0;
        background: radial-gradient(ellipse 120% 80% at 50% 38%, var(--charcoal) 0%, var(--charcoal-deep) 55%, #000000 100%); }
      #halo { position: absolute; left: 90px; top: 380px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity: 0.45; filter: blur(30px); }

      /* signature et barre de progression (haut, sous les onglets TikTok) */
      .handle { position: absolute; left: 70px; top: 120px; font-weight: 700; font-size: 30px; color: var(--silver); opacity: 0.8; }
      .tracker { position: absolute; left: 70px; top: 165px; display: flex; align-items: center; gap: 12px; }
      .tracker .lbl { font-weight: 700; font-size: 26px; letter-spacing: 0.08em; color: var(--silver); margin-right: 6px; }
      .tracker .slot { width: 46px; height: 46px; border-radius: 10px; border: 3px solid var(--dark); background: transparent; }

      /* en-tête de classement « N°x + nom » */
      .rank { position: absolute; left: 70px; top: 250px; display: flex; align-items: flex-end; gap: 22px; }
      .rank .no { font-weight: 700; color: var(--accent-soft); line-height: 0.8; display: flex; align-items: flex-start; }
      .rank .no small { font-size: 70px; margin-top: 18px; }
      .rank .no b { font-size: 190px; letter-spacing: -0.05em; }
      .rank .txt { padding-bottom: 14px; }
      .rank .name { font-weight: 700; font-size: 86px; letter-spacing: -0.03em; line-height: 1; }
      .rank .sub { font-weight: 700; font-size: 36px; color: var(--silver); margin-top: 8px; letter-spacing: 0.02em; }

      /* carte centrale (visuel, silhouette mystère, anneau) */
      .stagecard { position: absolute; left: 70px; top: 520px; width: 560px; height: 760px; }
      .cardvis { position: absolute; inset: 0; border-radius: 36px; overflow: hidden; border: 4px solid var(--accent);
        box-shadow: 0 0 60px rgba(218, 61, 57, 0.55), 0 30px 80px rgba(0, 0, 0, 0.6); background: var(--panel); }
      .mystery { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .mystery svg { width: 100%; height: 100%; }
      .ring { position: absolute; left: 50%; top: 50%; width: 820px; height: 820px; margin: -410px 0 0 -410px; border-radius: 50%;
        border: 6px solid var(--accent); box-shadow: 0 0 40px rgba(218, 61, 57, 0.55), inset 0 0 40px rgba(218, 61, 57, 0.4); opacity: 0; }
      .pricepill { position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%); padding: 12px 34px; border-radius: 999px;
        background: var(--accent); font-weight: 700; font-size: 40px; white-space: nowrap; box-shadow: 0 0 30px rgba(218, 61, 57, 0.6); }

      /* colonne de droite : badges, encadrés de stats */
      .side { position: absolute; left: 670px; top: 560px; width: 360px; display: flex; flex-direction: column; gap: 26px; }
      .badge { display: flex; align-items: center; gap: 16px; }
      .badge .ico { width: 64px; height: 64px; flex: none; }
      .badge .bt { font-weight: 700; font-size: 22px; letter-spacing: 0.12em; color: var(--accent-soft); }
      .badge .bv { font-weight: 700; font-size: 36px; line-height: 1.05; }
      .stat { width: 300px; padding: 18px 26px; border-radius: 22px; border: 3px solid var(--accent); background: rgba(28, 29, 33, 0.7);
        box-shadow: inset 0 0 30px rgba(218, 61, 57, 0.18); }
      .stat .v { font-weight: 700; font-size: 96px; line-height: 0.9; letter-spacing: -0.03em; }
      .stat .l { font-weight: 700; font-size: 24px; letter-spacing: 0.14em; color: var(--silver); margin-top: 6px; }
      .note { position: absolute; left: var(--cap-left); width: var(--cap-width); text-align: center; top: 1330px; font-weight: 700; font-size: 44px; color: var(--ink); }
      .note b { color: var(--accent-soft); }

      /* grille d'appel à l'action 2×2 */
      .ctagrid { position: absolute; left: 70px; top: 300px; display: grid; grid-template-columns: 300px 300px; gap: 26px; }
      .cta-btn { height: 220px; border-radius: 30px; border: 3px solid var(--accent); background: rgba(28, 29, 33, 0.75);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; font-weight: 700; font-size: 38px;
        box-shadow: 0 0 30px rgba(218, 61, 57, 0.35); }
      .cta-btn svg { width: 74px; height: 74px; }
      .ctanote { position: absolute; left: 70px; top: 800px; width: 626px; text-align: center; font-weight: 700; font-size: 36px; color: var(--silver); }

      /* grands titres (intro / outro) */
      .bigtitle { position: absolute; left: var(--cap-left); top: 520px; width: var(--cap-width); text-align: center; font-weight: 700; font-size: 128px; line-height: 0.95; letter-spacing: -0.04em; }
      .bigtitle .acc { color: var(--accent-soft); }
      .kicker { font-weight: 700; font-size: 40px; letter-spacing: 0.14em; color: var(--silver); margin-bottom: 26px; }

      /* sous-titres : un mot (ou deux) à la fois, sans contour */
      /* sous-titres CENTRÉS dans la zone sûre de la charte (jamais collés aux bords) */
      .cap { position: absolute; left: var(--cap-left); top: 1440px; width: var(--cap-width); height: 110px; display: flex; align-items: center;
        justify-content: center; text-align: center;
        font-weight: 700; font-size: 72px; letter-spacing: -0.02em; color: var(--ink); text-shadow: 0 4px 22px rgba(0, 0, 0, 0.7); }
      .cap .k { color: var(--accent-soft); margin-left: 18px; white-space: nowrap; }

      #blackout { position: absolute; inset: 0; background: #000000; opacity: 0; pointer-events: none; }
    </style>
