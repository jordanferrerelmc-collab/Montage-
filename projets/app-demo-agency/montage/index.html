<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <meta name="brand" content="specimen-agency" />
    <meta name="brand-default" content="specimen-agency" />
    <meta name="montage-style" content="app-demo" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/step-window.js"></script>
    <script src="assets/app-demo.js"></script>
    <link rel="stylesheet" href="assets/step-window.css" />
    <style>
      /* charte de marque injectée (brand/<marque>/brand.css) */
      /* ==========================================================================
         Charte Specimen Agency — SOURCE UNIQUE des couleurs et styles de marque.
         Ne pas redéfinir ces couleurs dans les compositions : utiliser les variables.
         Toute modification ici s'applique à toutes les prochaines vidéos.
         ========================================================================== */
      /* --- Police VERROUILLÉE : TeX Gyre Heros (équivalent libre d'Helvetica Neue, licence GUST — fonts/GUST-FONT-LICENSE.txt) ---
         Fichiers d'origine non modifiés. Famille propre à la marque : jamais de police de remplacement. */
      @font-face {
        font-family: "Specimen Heros";
        src: url("assets/brand/fonts/texgyreheros-regular.otf") format("opentype");
        font-weight: 100 599;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Specimen Heros";
        src: url("assets/brand/fonts/texgyreheros-bold.otf") format("opentype");
        font-weight: 600 900;
        font-style: normal;
        font-display: block;
      }
      
      :root {
        --gold: #e3b25c;
        --gold-light: #f2d58e;
        --gold-deep: #b8863b;
        --gold-grad: linear-gradient(135deg, #f0cd7c 0%, #e1b667 45%, #c79c4d 75%, #bd8e3e 100%);
        --black: #0b0b0d;
        --ivory: #f7f1e3;
        --ink: #ffffff;
        --flash: #fff8e8;
        --panel: rgba(11, 11, 13, 0.9);
        --panel-muted: rgba(40, 38, 35, 0.92);
        --taupe: #8a8378;
        --stone: #a59d90;
        --dark: #4a4540;
        --font: "Specimen Heros", sans-serif;
      
        /* alias génériques utilisés par les modèles */
        --accent: var(--gold);
        --accent-soft: var(--gold-light);
      
        /* mise en page Instagram Reels */
        --cap-top: 1260px;
        --cap-left: 60px;
        --cap-width: 960px;
        --ill-top: 150px;
      }
      
      /* --- Sous-titres ---------------------------------------------------------- */
      .w { display: inline-block; -webkit-text-stroke: 14px #000000; paint-order: stroke fill;
        text-shadow: 0 8px 0 rgba(0, 0, 0, 0.55); transform-origin: 50% 70%; }
      .hl, .hl-yellow, .hl-pink, .hl-green { color: var(--gold); }       /* mot clé */
      .hl-soft, .hl-red { color: var(--gold-light); }                       /* mot clé secondaire */
      
      /* --- Cartes et éléments graphiques --------------------------------------- */
      .panel { background: var(--panel); border-radius: 44px; padding: 34px 50px; display: flex; flex-direction: column;
        align-items: center; gap: 12px; color: var(--ink); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); border: 4px solid var(--gold); }
      .panel.row { flex-direction: row; gap: 34px; }
      .panel.col { padding: 30px 40px; }
      .panel.green, .panel.accent { border-color: var(--gold-light); box-shadow: 0 0 0 4px rgba(227, 178, 92, 0.35), 0 24px 60px rgba(0, 0, 0, 0.35); }
      .big { font-weight: 800; font-size: 88px; line-height: 1; text-align: left; letter-spacing: 0.03em; color: var(--ivory); }
      .big small { font-size: 52px; font-weight: 800; opacity: 0.85; }
      .kicker { font-weight: 700; font-size: 40px; letter-spacing: 0.22em; color: var(--gold); }
      .chip { font-weight: 800; font-size: 120px; padding: 10px 50px; background: var(--ivory); color: var(--black); border-radius: 30px; letter-spacing: 0.06em; }
      .num { color: var(--gold); display: inline-block; }
      .bubble { background: var(--ivory); color: var(--black); border: 4px solid var(--gold); font-weight: 700; font-size: 56px;
        padding: 36px 48px; border-radius: 48px 48px 48px 8px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); max-width: 860px; }
      .stamp { font-weight: 900; font-size: 210px; color: var(--gold); border: 18px solid var(--gold); border-radius: 36px; letter-spacing: 0.06em;
        padding: 0 50px; transform: rotate(-10deg); background: var(--panel); line-height: 1.15; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4); }
      .num-badge { width: 170px; height: 170px; border-radius: 50%; background: var(--black); color: var(--gold); border: 8px solid var(--gold);
        font-weight: 800; font-size: 120px; display: flex; align-items: center; justify-content: center; box-shadow: 0 14px 0 rgba(0, 0, 0, 0.35); flex: none; }
      .cta { display: flex; align-items: center; gap: 26px; background: var(--gold-grad); color: var(--black); font-weight: 800; font-size: 70px;
        letter-spacing: 0.04em; padding: 36px 56px; border-radius: 999px; box-shadow: 0 18px 0 rgba(0, 0, 0, 0.35); }
      
      /* --- Transitions ---------------------------------------------------------- */
      #flash, #redflash, #accentflash { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
      #flash { background: var(--flash); }
      #redflash, #accentflash { background: var(--gold); mix-blend-mode: screen; }
      
      /* --- Écran de fin ----------------------------------------------------------- */
      #endcard { position: absolute; inset: 0; background: var(--gold-grad); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 90px; }
      #logo { width: 700px; height: 700px; border-radius: 50%; box-shadow: 0 40px 80px rgba(80, 50, 10, 0.45); }
      #tagline { width: 1080px; text-align: center; font-weight: 800; font-size: 56px; line-height: 1.5; letter-spacing: 0.18em; color: var(--black); }
    </style>
    <link rel="stylesheet" href="assets/specimen-window.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font); color: var(--ink); }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 110% 70% at 50% 40%, var(--panel) 0%, var(--black) 70%); }
      #halo { position: absolute; left: 140px; top: 620px; width: 800px; height: 800px; border-radius: 50%;
        background: radial-gradient(circle, var(--accent) 0%, transparent 65%); opacity: 0.28; filter: blur(40px); }
      .head { position: absolute; left: 60px; top: 260px; width: 960px; }
      .kick { font-weight: 700; font-size: 30px; letter-spacing: 0.2em; color: var(--accent); }
      .ttl { font-weight: 700; font-size: 104px; line-height: 0.95; letter-spacing: -0.04em; margin-top: 18px; }
      .ttl .a { color: var(--accent-soft, var(--accent)); }
      #win { position: absolute; left: 40px; top: 600px; width: 1000px; transform-origin: 50% 0; }
      .say { position: absolute; left: 60px; top: 1435px; width: 960px; font-weight: 700; font-size: 58px; line-height: 1.12;
        letter-spacing: -0.02em; text-shadow: 0 4px 22px rgba(0, 0, 0, 0.7); }
      .say .a { color: var(--accent-soft, var(--accent)); }
      /* #endcard et #logo : styles de la charte (brand.css) */
      #blackout { position: absolute; inset: 0; background: #000000; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="22.1" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="halo"></div>
      <div class="head" id="head"><div class="kick" id="kick">SPECIMEN AGENCY · PROCESS</div><div class="ttl" id="ttl">Du rush<br><span class='a'>au Reel</span></div></div>
      <div id="win"></div>
      <div class="say clip" id="say0" data-start="1.30" data-duration="3.60" data-track-index="3">Importe ton <span class='a'>rush</span></div>
      <div class="say clip" id="say1" data-start="4.90" data-duration="5.00" data-track-index="3">Les blancs <span class='a'>disparaissent</span></div>
      <div class="say clip" id="say2" data-start="9.90" data-duration="4.60" data-track-index="3">Sous-titres <span class='a'>mot à mot</span></div>
      <div class="say clip" id="say3" data-start="14.50" data-duration="4.40" data-track-index="3">Ton Reel est <span class='a'>prêt</span></div>
      <div id="blackout"></div>
      <div class="clip" id="endcard" data-start="19.70" data-duration="2.4" data-track-index="5"><img id="logo" src="assets/brand/logo.png" alt="Specimen Agency"/></div>
    </div>
    <audio id="a0" class="clip" src="assets/sfx/whoosh-long.wav" data-start="0.000" data-duration="1.1" data-volume="0.3" data-track-index="6"></audio>
    <audio id="a1" class="clip" src="assets/sfx/montee-ui.wav" data-start="0.700" data-duration="0.5" data-volume="0.25" data-track-index="7"></audio>
    <audio id="a2" class="clip" src="assets/sfx/clic.wav" data-start="2.650" data-duration="0.05" data-volume="0.4" data-track-index="6"></audio>
    <audio id="a3" class="clip" src="assets/sfx/clic.wav" data-start="5.700" data-duration="0.05" data-volume="0.4" data-track-index="6"></audio>
    <audio id="a4" class="clip" src="assets/sfx/whoosh-court.wav" data-start="4.850" data-duration="0.5" data-volume="0.14" data-track-index="6"></audio>
    <audio id="a5" class="clip" src="assets/sfx/clic.wav" data-start="10.700" data-duration="0.05" data-volume="0.4" data-track-index="6"></audio>
    <audio id="a6" class="clip" src="assets/sfx/whoosh-court.wav" data-start="9.850" data-duration="0.5" data-volume="0.14" data-track-index="6"></audio>
    <audio id="a7" class="clip" src="assets/sfx/clic.wav" data-start="15.200" data-duration="0.05" data-volume="0.4" data-track-index="6"></audio>
    <audio id="a8" class="clip" src="assets/sfx/whoosh-court.wav" data-start="14.450" data-duration="0.5" data-volume="0.14" data-track-index="6"></audio>
    <audio id="a9" class="clip" src="assets/sfx/validation.wav" data-start="18.800" data-duration="0.45" data-volume="0.25" data-track-index="6"></audio>
    <audio id="a10" class="clip" src="assets/sfx/impact-boom.wav" data-start="19.700" data-duration="0.9" data-volume="0.35" data-track-index="6"></audio>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const { ease, typed, cue, held, glide } = window.AppDemo;
      // Démo « Du rush au Reel » (Specimen Agency) — scène 1200 × 750, une étape = { id, name, dur, html, draw, say, clicks, keys }.
      // Interface 100 % originale, couleurs uniquement par variables de la charte.
      const CK = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" style="stroke:currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      const side = (on) => `<div class="sp-side"><h4>PROJETS</h4>${["Reel conseils", "Interview", "Process"]
        .map((n, i) => `<div class="sp-card${i === on ? " on" : ""}" style="font-size:26px">${n}</div>`).join("")}
        <div class="sp-muted" style="margin-top:auto">Specimen Agency</div></div>`;
      const abs = (l, t, w, h, extra = "") => `position:absolute;left:${l}px;top:${t}px;${w ? `width:${w}px;` : ""}${h ? `height:${h}px;` : ""}${extra}`;
      const WAVE = Array.from({ length: 64 }, (_, i) => {
        const silent = [10, 11, 12, 24, 25, 38, 39, 40, 52, 53].includes(i);
        return { silent, h: silent ? 5 : 22 + 70 * Math.abs(Math.sin(i * 1.7) * Math.cos(i * 0.43)) };
      });
      const GROUPS = [[1.2, "Tes vidéos"], [2.0, "Instagram"], [2.7, "font"], [3.2, "<span style='color:var(--accent)'>200 vues</span>"]];
      
      const STEPS = [
        {
          id: "import", name: "Importer", dur: 3.6, say: "Importe ton <span class='a'>rush</span>", clicks: [1.35],
          html: `<div class="sp-app">${side(0)}<div class="sp-main">
            <div class="sp-title">Nouveau montage</div><div class="sp-muted">Glisse ta vidéo ou importe-la</div>
            <div id="drop" style="${abs(32, 170, 836, 420, "border:3px dashed var(--dark);border-radius:22px")}"></div>
            <div class="sp-btn" id="imp" style="${abs(330, 348, 240)}">Importer</div>
            <div class="sp-card" id="file" style="${abs(32, 170, 836, 420, "display:flex;gap:30px;align-items:center;padding:30px")}">
              <img src="assets/thumb.jpg" style="height:356px;width:200px;object-fit:cover;border-radius:14px"/>
              <div style="flex:1;display:flex;flex-direction:column;gap:20px">
                <div style="font-size:34px">video1.mp4</div><div class="sp-muted">1080 × 1920 · 28,4 s · voix</div>
                <div class="sp-progress" id="pg"><i></i></div>
                <div class="sp-row" style="justify-content:flex-start"><span class="sp-check" id="ok">${CK}</span><span class="sp-muted" id="okt">Import…</span></div>
              </div></div></div></div>`,
          draw(t, $) {
            const k = ease(t, 1.5, 1.8);
            $("#drop").style.borderColor = t > 0.9 && t < 1.5 ? "var(--accent)" : "var(--dark)";
            $("#imp").style.opacity = t < 1.5 ? 1 : 0;
            $("#file").style.opacity = k;
            $("#file").style.transform = `translateY(${(1 - k) * 24}px)`;
            $("#pg").style.setProperty("--p", ease(t, 1.7, 2.9));
            $("#ok").style.opacity = t > 2.9 ? 1 : 0.15;
            $("#okt").textContent = t > 2.9 ? "Importé" : "Import…";
            return { cursor: glide(t, [[0, 0, 1020, 660], [0.3, 1.2, 750, 380], [1.8, 2.6, 1060, 690]], [1.35]) };
          },
        },
        {
          id: "cut", name: "Silences", dur: 5.0, say: "Les blancs <span class='a'>disparaissent</span>", clicks: [0.8],
          html: `<div class="sp-app">${side(0)}<div class="sp-main">
            <div class="sp-row"><div class="sp-title">video1.mp4</div><div class="sp-title" id="len" style="color:var(--accent)">28,4 s</div></div>
            <div class="sp-muted">Détection des silences</div>
            <div id="wave" style="${abs(32, 180, 836, 260, "display:flex;align-items:center;gap:3px")}">${WAVE
              .map((b) => `<i class="${b.silent ? "sil" : ""}" style="display:block;flex:0 0 10px;height:${b.h}%;border-radius:4px;background:var(--stone)"></i>`).join("")}</div>
            <div class="sp-btn" id="go" style="${abs(32, 480, 340)}">Couper les blancs</div>
            <div class="sp-toast" id="toast"><span class="sp-check">${CK}</span>1,4 s de blancs retirés · 10 coupes</div></div></div>`,
          draw(t, $) {
            const mark = ease(t, 0.9, 1.3), cut = ease(t, 1.8, 2.7);
            $("#wave").querySelectorAll("i").forEach((el) => {
              if (!el.classList.contains("sil")) return;
              el.style.background = mark > 0 ? "var(--accent)" : "var(--stone)";
              el.style.opacity = String(1 - cut);
              el.style.flexBasis = `${10 * (1 - cut)}px`;
              el.style.height = `${5 + 90 * mark * (1 - cut)}%`;
            });
            $("#len").textContent = `${(28.4 - 1.4 * cut).toFixed(1).replace(".", ",")} s`;
            $("#go").style.opacity = t > 2.7 ? 0.35 : 1;
            const k = ease(t, 2.3, 2.6);
            $("#toast").style.opacity = k;
            $("#toast").style.transform = `translate(-50%, ${(1 - k) * 30}px)`;
            return { cursor: glide(t, [[0, 0, 1040, 690], [0.1, 0.7, 520, 515], [1.2, 2.0, 980, 640]], [0.8]) };
          },
        },
        {
          id: "subs", name: "Sous-titres", dur: 4.6, say: "Sous-titres <span class='a'>mot à mot</span>", clicks: [0.8],
          html: `<div class="sp-app">${side(0)}<div class="sp-main">
            <div style="${abs(32, 28, 300, 533, "border-radius:22px;overflow:hidden;border:2px solid var(--dark)")}">
              <img src="assets/thumb.jpg" style="width:100%;height:100%;object-fit:cover"/>
              <div id="cap" style="position:absolute;left:0;right:0;top:330px;text-align:center;font-size:34px;color:var(--ink);text-shadow:0 3px 14px rgba(0,0,0,0.8)"></div></div>
            <div class="sp-muted" style="${abs(380, 34)}">Style des sous-titres</div>
            <div class="sp-chip" id="c1" style="${abs(380, 80, 300, null, "justify-content:center")}">Classique</div>
            <div class="sp-chip" id="c2" style="${abs(380, 140, 300, null, "justify-content:center")}">Charte Specimen</div>
            <div class="sp-card" id="spec" style="${abs(380, 210, 470, null, "display:flex;flex-direction:column;gap:12px")}">
              <div class="sp-row"><span class="sp-muted">Police</span><span>Specimen Heros · gras</span></div>
              <div class="sp-row"><span class="sp-muted">Rythme</span><span>1 à 3 mots</span></div>
              <div class="sp-row"><span class="sp-muted">Mots clés</span><span style="color:var(--accent)">Or</span></div></div>
            <div id="lines" style="${abs(380, 420, 470, null, "display:flex;flex-direction:column;gap:8px;font-size:26px")}">${GROUPS
              .map(([at, w]) => `<div class="sp-row"><span class="sp-muted">${at.toFixed(1).replace(".", ",")} s</span><span>${w}</span></div>`).join("")}</div>
            </div></div>`,
          draw(t, $) {
            const on = t > 0.8;
            $("#c1").classList.toggle("on", !on);
            $("#c2").classList.toggle("on", on);
            $("#spec").style.opacity = ease(t, 0.85, 1.15);
            $("#spec").classList.toggle("on", on);
            const g = cue(t, GROUPS.map(([at], i) => [at, i]), -1);
            $("#cap").innerHTML = g < 0 ? "" : GROUPS[g][1];
            $("#lines").querySelectorAll(".sp-row").forEach((r, i) => { r.style.opacity = i <= g ? 1 : 0.3; });
            return { cursor: glide(t, [[0, 0, 1020, 640], [0.1, 0.7, 830, 165], [1.4, 2.2, 1100, 700]], [0.8]) };
          },
        },
        {
          id: "export", name: "Exporter", dur: 4.4, say: "Ton Reel est <span class='a'>prêt</span>", clicks: [0.7],
          html: `<div class="sp-app">${side(0)}<div class="sp-main">
            <div class="sp-title">Exporter</div>
            ${[["Format", "1080 × 1920 · Reel"], ["Son", "Normalisé à -14 LUFS"], ["Fichiers", "HD + version légère"]]
              .map(([a, b]) => `<div class="sp-card sp-row"><span class="sp-muted">${a}</span><span>${b}</span></div>`).join("")}
            <div class="sp-row" style="justify-content:flex-start;gap:28px"><div class="sp-btn" id="ex" style="width:260px">Exporter</div>
              <div style="flex:1;display:flex;flex-direction:column;gap:10px"><div class="sp-progress" id="pg"><i></i></div><div class="sp-muted" id="pc">0 %</div></div></div>
            <div class="sp-toast" id="toast"><span class="sp-check">${CK}</span>Reel prêt · 1080×1920 · 27 s</div></div></div>`,
          draw(t, $) {
            const p = ease(t, 0.9, 2.2);
            $("#pg").style.setProperty("--p", p);
            $("#pc").textContent = t < 0.9 ? "Prêt à exporter" : `${Math.round(p * 100)} %`;
            $("#ex").classList.toggle("ghost", t > 0.7);
            const k = ease(t, 2.3, 2.6);
            $("#toast").style.opacity = k;
            $("#toast").style.transform = `translate(-50%, ${(1 - k) * 30}px)`;
            return { cursor: glide(t, [[0, 0, 1040, 690], [0.1, 0.6, 470, 455], [1.2, 2.0, 1080, 660]], [0.7]) };
          },
        },
      ];
      const demo = window.AppDemo.bind(tl, document.getElementById("win"), { steps: STEPS, tabs: ["Montage", "video1.mp4"], label: "Du rush au Reel", start: 1.3 });
      const blurIn = (s, t, o = {}) => tl.fromTo(s, { opacity: 0, filter: "blur(18px)", y: 24 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: o.d || 0.45, ease: "power3.out", immediateRender: true }, t);
      const blurOut = (s, t) => tl.to(s, { opacity: 0, filter: "blur(14px)", duration: 0.3 }, t);
      tl.fromTo("#halo", { opacity: 0.2, scale: 0.95 }, { opacity: 0.38, scale: 1.08, duration: 1.6, yoyo: true, repeat: 13, ease: "sine.inOut", immediateRender: false }, 0);
      tl.fromTo("#head", { scale: 1.04, transformOrigin: "0 50%" }, { scale: 1, duration: 1.2, ease: "power2.out", immediateRender: true }, 0);
      tl.fromTo("#win", { opacity: 0, scale: 0.92, y: 60, filter: "blur(16px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", immediateRender: true }, 0.7);
      blurIn("#say0", 1.35, { d: 0.35 });
      blurOut("#say0", 4.60);
      blurIn("#say1", 4.95, { d: 0.35 });
      blurOut("#say1", 9.60);
      blurIn("#say2", 9.95, { d: 0.35 });
      blurOut("#say2", 14.20);
      blurIn("#say3", 14.55, { d: 0.35 });
      blurOut("#head, #win, #say3", 19.25);
      tl.fromTo("#blackout", { opacity: 0 }, { opacity: 1, duration: 0.35, immediateRender: false }, 19.40);
      tl.fromTo("#logo", { opacity: 0, scale: 1.1, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out", immediateRender: true }, 19.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
