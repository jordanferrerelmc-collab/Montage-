<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b0d12;
        --ink: #f4f1ea;
        --accent: #ff5a36;
        --font-display: "Helvetica Neue", Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        font-family: var(--font-display);
      }
      #bar,
      #title,
      #subtitle {
        position: absolute;
        left: 0;
        width: 1920px;
        text-align: center;
      }
      #bar {
        top: 360px;
        left: 640px;
        width: 640px;
        height: 12px;
        transform-origin: left center;
        background: var(--accent);
      }
      #title {
        top: 410px;
        line-height: 1;
        color: var(--ink);
        font-size: 140px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      #subtitle {
        top: 600px;
        color: var(--ink);
        opacity: 0.75;
        font-size: 44px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="bar" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
      <h1 id="title" class="clip" data-start="0" data-duration="5" data-track-index="1">Montage</h1>
      <p id="subtitle" class="clip" data-start="0" data-duration="5" data-track-index="2">HyperFrames · HTML → MP4</p>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 0.2);
      tl.fromTo(
        "#title",
        { scale: 0.92 },
        { scale: 1, duration: 1.2, ease: "power4.out" },
        0
      );
      tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 0.75, y: 0, duration: 0.7, ease: "power2.out" }, 1.1);
      tl.to(["#title", "#subtitle", "#bar"], { opacity: 0, duration: 0.5, ease: "power1.in" }, 4.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
